<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Trainer Battler</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0f172a;
        touch-action: none;
      }

      #app {
        width: 100%;
        height: 100%;
      }

      #joystick {
        position: fixed;
        left: 24px;
        bottom: 24px;
        width: 160px;
        height: 160px;
        z-index: 10;
        display: none;
        touch-action: none;
      }

      #battle-button {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 10;
        display: none;
        border: 0;
        border-radius: 999px;
        padding: 14px 20px;
        background: #dc2626;
        color: #f8fafc;
        font-size: 16px;
        font-weight: 600;
        touch-action: manipulation;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.5);
      }

      #battle-button:active {
        transform: translateY(1px);
      }

      #pokedex-open-button {
        position: fixed;
        right: 24px;
        top: 24px;
        z-index: 10;
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        background: #2563eb;
        color: #eff6ff;
        font-size: 15px;
        font-weight: 700;
        touch-action: manipulation;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.5);
      }

      #regenerate-map-button {
        position: fixed;
        right: 24px;
        top: 76px;
        z-index: 10;
        display: none;
        border: 0;
        border-radius: 999px;
        padding: 10px 14px;
        background: #f59e0b;
        color: #111827;
        font-size: 13px;
        font-weight: 700;
        touch-action: manipulation;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.5);
      }

      #copy-seed-button {
        position: fixed;
        right: 24px;
        top: 124px;
        z-index: 10;
        display: none;
        border: 0;
        border-radius: 999px;
        padding: 10px 14px;
        background: #22d3ee;
        color: #082f49;
        font-size: 13px;
        font-weight: 700;
        touch-action: manipulation;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.5);
      }

      #toggle-collision-button {
        position: fixed;
        right: 24px;
        top: 172px;
        z-index: 10;
        display: none;
        border: 0;
        border-radius: 999px;
        padding: 10px 14px;
        background: #c084fc;
        color: #2e1065;
        font-size: 13px;
        font-weight: 700;
        touch-action: manipulation;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.5);
      }

      #pokedex-panel {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        flex-direction: column;
        gap: 20px;
        padding: 24px;
        background: rgba(15, 23, 42, 0.96);
        color: #e2e8f0;
        font-family: sans-serif;
      }

      #pokedex-panel h2 {
        margin: 0;
      }

      #pokedex-list {
        margin: 0;
        padding-left: 20px;
      }

      #pokedex-close-button {
        align-self: flex-start;
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        background: #22c55e;
        color: #052e16;
        font-size: 15px;
        font-weight: 700;
      }

      canvas {
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="joystick"></div>
    <button id="battle-button" type="button">Battle</button>
    <button id="pokedex-open-button" type="button">Open Pokédex</button>
    <button id="regenerate-map-button" type="button">Regenerate (New Seed)</button>
    <button id="copy-seed-button" type="button">Copy Seed</button>
    <button id="toggle-collision-button" type="button">Show Collision</button>
    <section id="pokedex-panel" aria-hidden="true">
      <h2>Pokédex</h2>
      <ul id="pokedex-list"></ul>
      <button id="pokedex-close-button" type="button">Close Pokédex</button>
    </section>
    <script src="https://cdn.jsdelivr.net/gh/bobboteck/JoyStick/joy.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
