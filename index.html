<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Trainer Battler</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0f172a;
        touch-action: none;
      }

      #app {
        width: 100%;
        height: 100%;
      }

      #joystick {
        position: fixed;
        left: 24px;
        bottom: 24px;
        width: 160px;
        height: 160px;
        z-index: 10;
        display: none;
        touch-action: none;
      }

      #battle-button {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 10;
        display: none;
        border: 0;
        border-radius: 999px;
        padding: 14px 20px;
        background: #dc2626;
        color: #f8fafc;
        font-size: 16px;
        font-weight: 600;
        touch-action: manipulation;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.5);
      }

      #battle-button:active {
        transform: translateY(1px);
      }

      canvas {
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="joystick"></div>
    <button id="battle-button" type="button">Battle</button>
    <script src="https://cdn.jsdelivr.net/gh/bobboteck/JoyStick/joy.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
