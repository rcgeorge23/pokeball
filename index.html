<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Trainer Battler</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0f172a;
        touch-action: none;
      }

      #app {
        width: 100%;
        height: 100%;
      }

      #joystick {
        position: fixed;
        left: 24px;
        bottom: 24px;
        width: 160px;
        height: 160px;
        z-index: 10;
        display: none;
        touch-action: none;
      }

      canvas {
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="joystick"></div>
    <script src="https://cdn.jsdelivr.net/gh/bobboteck/JoyStick/joy.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
