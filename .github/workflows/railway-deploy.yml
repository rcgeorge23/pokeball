name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: railway-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID || vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID || vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_NAME: ${{ secrets.RAILWAY_SERVICE_NAME || vars.RAILWAY_SERVICE_NAME }}
        run: |
          missing=()

          [[ -n "$RAILWAY_PROJECT_ID" ]] || missing+=("RAILWAY_PROJECT_ID")
          [[ -n "$RAILWAY_ENVIRONMENT_ID" ]] || missing+=("RAILWAY_ENVIRONMENT_ID")
          [[ -n "$RAILWAY_SERVICE_NAME" ]] || missing+=("RAILWAY_SERVICE_NAME")

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing required Railway configuration: ${missing[*]}" >&2
            echo "Set each value as a GitHub Actions secret or repository variable." >&2
            exit 1
          fi

          railway link --project $RAILWAY_PROJECT_ID --environment $RAILWAY_ENVIRONMENT_ID
          railway up --service $RAILWAY_SERVICE_NAME
